<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to Frost Client...</title>
    
    <!-- ISTO FAZ O REDIRECIONAMENTO AUTOMÁTICO -->
    <!-- O número "3" significa que espera 3 segundos antes de redirecionar. Podes mudar para 0 se quiseres que seja instantâneo. -->
    <meta http-equiv="refresh" content="3;url=https://www.mediafire.com/file/dkft1pmc1h5jldq/FrostClient.exe/file">
    
    <style>
        body {
            background-color: #0D0D0F;
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #1A1A1E;
            border-top: 4px solid #5B9DFF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #5B9DFF;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Redirecting to your download...</h2>
    <p>You are being redirected to MediaFire. If nothing happens, <a href="https://www.mediafire.com/file/dkft1pmc1h5jldq/FrostClient.exe/file">click here</a>.</p>
</body>
</html>
